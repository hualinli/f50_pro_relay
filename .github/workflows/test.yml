name: Go
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: false
      - run: go test -race ./...
      - run: go vet ./...
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build ./...
